[package]
name = "ariadne"
version = "0.1.0"
edition = "2021"
description = "Ariadne — secretária de uma equipe pequena no Telegram (recados, tarefas, agenda, viagens)"
license-file = "LICENSE.md"
publish = false

[dependencies]
# Telegram, Claude, Google, util e as regras de tempo das tarefas vêm daqui (ver PLANO.md, Dependência)
argos = { path = "../argos" }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std", "filter-by-regex"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
